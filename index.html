<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trophy House — Login</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f172a;font-family:Arial,sans-serif}
*{box-sizing:border-box}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0f172a;z-index:10}
.box{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.45);color:#111827}
.box img{display:block;width:auto;max-width:170px;max-height:80px;margin:0 auto 14px}
h1{text-align:center;font-size:26px;margin:4px 0 7px}.sub{text-align:center;color:#64748b;margin-bottom:20px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:#fff;color:#111827}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;font-weight:700}
#msg{text-align:center;color:#dc2626;font-size:13px;min-height:18px;margin-top:10px}
.hint{text-align:center;color:#64748b;font-size:12px;margin-top:12px}
#app{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:1}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <img src="trophy_house_logo.png" onerror="this.style.display='none'">
    <h1>Trophy House</h1>
    <div class="sub">Real Stock Management • Secure Login</div>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" placeholder="Username">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="Password">
    <button id="go" type="button">Login</button>
    <div id="msg"></div>
    <div class="hint">Default Admin: admin / admin123</div>
  </div>
</div>
<iframe id="app" title="Trophy House App"></iframe>

<script>
(function(){
  const defs=[
    {u:'admin',n:'Administrator',p:'admin123',r:'Admin'},
    {u:'manager',n:'Manager',p:'manager123',r:'Manager'},
    {u:'billing',n:'Billing Staff',p:'billing123',r:'Billing'},
    {u:'store',n:'Store Staff',p:'store123',r:'Store'},
    {u:'production',n:'Production Staff',p:'production123',r:'Production'},
    {u:'labour',n:'Labour Staff',p:'labour123',r:'Labour'}
  ];
  const login=document.getElementById('login'), frame=document.getElementById('app'),
        u=document.getElementById('u'), p=document.getElementById('p'),
        btn=document.getElementById('go'), msg=document.getElementById('msg');

  function hideLegacy(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      const st=d.createElement('style');
      st.textContent=
        '#v32Login,#thEmergencyLogin,#TH_LOGIN_FORCE{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}';
      d.head.appendChild(st);
      ['v32Login','thEmergencyLogin','TH_LOGIN_FORCE'].forEach(id=>{
        const e=d.getElementById(id); if(e)e.style.setProperty('display','none','important');
      });
    }catch(e){}
  }
  function enter(){
    const name=(u.value||'').trim(), pass=p.value||'';
    const found=defs.find(x=>x.u===name && x.p===pass);
    if(!found){msg.textContent='Wrong username or password';return;}
    try{
      localStorage.setItem('th_v32_users',JSON.stringify(defs));
      localStorage.setItem('th_v32_session',JSON.stringify({u:found.u,n:found.n,r:found.r}));
    }catch(e){}
    login.style.display='none';
    frame.style.display='block';
    frame.src='app.html?v=stable1';
  }
  frame.addEventListener('load',function(){
    hideLegacy();
    setTimeout(hideLegacy,100);
    setTimeout(hideLegacy,500);
    setTimeout(hideLegacy,1500);
    setTimeout(hideLegacy,3000);
  });
  btn.addEventListener('click',enter);
  p.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
  u.addEventListener('keydown',e=>{if(e.key==='Enter')p.focus()});
})();
</script>
</body>
</html>
